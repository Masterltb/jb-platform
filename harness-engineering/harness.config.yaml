# harness.config.yaml
# =============================================================================
# Harness Engineering Framework (HEF v4.0.0) — JaeBinPlatform Configuration
# =============================================================================

harness_framework_version: "4.0.0"

project:
  name: "Anhem JaeBin – Ăn Chơi Điệu Nghệ"
  id: "jaebin-platform"
  description: "Web Card Battler Game kết hợp Web Portal (Thẻ bài nhân vật, 6 ô trang bị theo rank, Gacha, Giftcode, Nạp thẻ)"
  type: "web-card-fullstack"
  domain: "gaming"

# ─────────────────────────────────────────────────────
# Surfaces: Khai báo 3 surface chính của Monorepo
# ─────────────────────────────────────────────────────
surfaces:
  backend:
    enabled: true
    location: "services/game-backend/"
    stack: "node-nestjs"
    test_command: "npm test"
    build_command: "npm run build"

  frontend_web:
    enabled: true
    location: "apps/web-portal/"
    stack: "nextjs"
    test_command: "npm run build"
    build_command: "npm run build"

  mobile:
    enabled: true
    location: "apps/mobile-client/"
    stack: "unity-2d-csharp"
    validate_command: "dotnet format --verify-no-changes"
    build_debug_command: "Unity -batchmode -quit -executeMethod BuildScript.BuildAndroidDebug"

# ─────────────────────────────────────────────────────
# Multi-Role Review — Bật đầy đủ 7 role cho solo dev + AI
# ─────────────────────────────────────────────────────
roles:
  orchestrator: true
  frontend_engineer: true
  backend_engineer: true
  devops_engineer: true
  security_auditor: true
  qa_engineer: true
  devil_advocate: true

# ─────────────────────────────────────────────────────
# Risk lanes
# ─────────────────────────────────────────────────────
lanes:
  tiny:
    role_review_required: false
    ci_gates: ["tests-pass"]
  normal:
    role_review_required: true
    ci_gates: ["tests-pass", "lint-pass", "type-check-pass"]
    min_roles_passing: 4
  high_risk:
    role_review_required: true
    ci_gates: ["tests-pass", "lint-pass", "type-check-pass", "security-scan-pass"]
    min_roles_passing: 6
    requires_failure_memory: true
    requires_human_confirmation: true

# ─────────────────────────────────────────────────────
# Quality Gates
# ─────────────────────────────────────────────────────
quality_gates:
  frontend:
    eslint_max_warnings: 0
    typescript_errors: 0
    bundle_size_gzip_kb: 500
    lighthouse_performance_min: 75

  backend:
    test_coverage_min_pct: 60
    dependency_critical_vulns: 0
    dependency_high_vulns: 0

  mobile:
    apk_size_mb_warning: 100
    required_abis: ["arm64-v8a", "armeabi-v7a"]
    min_sdk_version: 24
    target_sdk_version: 34
    page_size_alignment_kb: 16

  general:
    pr_max_lines_changed: 400
    pr_max_files_changed: 40

# ─────────────────────────────────────────────────────
# Branch strategy
# ─────────────────────────────────────────────────────
branching:
  strategy: "trunk-based"
  main_branch: "main"
  protected_branches: ["main"]
  short_lived_branches: true
  max_branch_age_days: 5
  naming_convention: "{type}/{id}-{short-description}"
  allowed_types: ["feat", "fix", "chore", "docs", "refactor", "test", "perf"]

# ─────────────────────────────────────────────────────
# Commit convention
# ─────────────────────────────────────────────────────
commits:
  standard: "conventional-commits"
  enforce: "ci"
  scopes:
    - "backend"
    - "frontend"
    - "mobile"
    - "infra"
    - "harness"
    - "docs"
    - "deps"
    - "security"

# ─────────────────────────────────────────────────────
# Compliance
# ─────────────────────────────────────────────────────
compliance:
  legal_rules_enabled: false
  domain_pack: "generic"
  forbidden_terms: []
  e2e_legal_assertion: false

# ─────────────────────────────────────────────────────
# DORA Metrics
# ─────────────────────────────────────────────────────
dora:
  track: true
  targets:
    deployment_frequency: "weekly"
    lead_time_hours: 72
    change_failure_rate_pct: 15
    mttr_hours: 24

# ─────────────────────────────────────────────────────
# Context Engineering & Session Handoff
# ─────────────────────────────────────────────────────
context_engineering:
  token_budget_max: 16000
  file_slice_limit_lines: 800
  impact_map_required: true
  session_handoff_enabled: true
  handoff_dir: "context/handoff/"

# ─────────────────────────────────────────────────────
# Sandbox
# ─────────────────────────────────────────────────────
sandbox:
  policy_doc: "core/SANDBOX_POLICY.md"
  network_write_lanes: ["high_risk"]

# ─────────────────────────────────────────────────────
# Harness CLI location
# ─────────────────────────────────────────────────────
cli:
  binary_unix: "./scripts/bin/harness-cli"
  binary_windows: ".\\scripts\\bin\\harness-cli.ps1"
  db_path: "./harness.db"

# ─────────────────────────────────────────────────────
# Golden Path Archetypes
# ─────────────────────────────────────────────────────
archetypes:
  available:
    - id: "mobile-fullstack"
      path: "golden-paths/archetypes/mobile-fullstack.md"
    - id: "web-fullstack"
      path: "golden-paths/archetypes/web-fullstack.md"

skills:
  directory: "skills/"
  library: []

mcp:
  config_path: "mcp/mcp.config.json"
  servers: []
