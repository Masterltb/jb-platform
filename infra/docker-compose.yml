version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jaebin-postgres
    restart: always
    environment:
      POSTGRES_USER: jaebin_admin
      POSTGRES_PASSWORD: jaebin_password_secret
      POSTGRES_DB: jaebin_game_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jaebin-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:latest
    container_name: jaebin-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
